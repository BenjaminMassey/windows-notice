[package]
name = "windows-notice"
version = "0.1.0"
edition = "2024"
default-run = "sender"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["UI_Notifications", "Data_Xml_Dom"] }
windows-registry = "0.6.1"
